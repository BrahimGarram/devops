version: '3.8'

services:

  # Base de données MySQL
  mysql:
    image: mysql:8
    container_name: tp-foyer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tpfoyer
    ports:
      - "3306:3306"
    networks:
      - tp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # Application Spring Boot
  tpfoyer:
    image: tp-foyer-app:1.0
    container_name: tp-foyer-container
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://tp-foyer-mysql:3306/tpfoyer
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8081:8080"  # 8081 sur l'hôte, 8080 dans le container
    networks:
      - tp-network

networks:
  tp-network:
    driver: bridge
